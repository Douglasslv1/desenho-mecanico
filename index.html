<script>
const EXPLAIN={"01": {"Prancheta → CAD": "Antes dos sistemas CAD, o desenho técnico era desenvolvido manualmente em pranchetas. Os sistemas CAD passaram a apoiar a criação, edição e documentação do desenho por computador. O material original situa o início do CAD na década de 1950 e apresenta a evolução do AutoCAD a partir de 1982.", "Interface": "A interface reúne os principais meios de trabalho: Ribbon para acesso às ferramentas, área gráfica para construção do desenho, linha de comando para acompanhar e informar operações, ViewCube e Navigation Bar para visualização e barra de status para recursos de apoio.", "Primeiro contato": "O objetivo inicial é conseguir abrir e criar arquivos, reconhecer a interface, navegar no desenho e configurar unidades e área de trabalho. Para desenho mecânico, trabalhe de forma consistente com as unidades definidas para o projeto."}, "02": {"Criação": "Os comandos de Draw criam a geometria básica. LINE cria segmentos independentes; PLINE cria segmentos conectados como um único objeto; CIRCLE cria círculos; ARC cria arcos; RECTANGLE cria retângulos; ELLIPSE cria elipses. O material-base concentra essas ferramentas em Home → Draw.", "Atalhos": "O material apresenta o uso de atalhos pelo teclado seguido de Enter: L para Line, PL para Polyline, C para Circle, ARC para Arc, REC para Rectangle e EL para Ellipse. ESC encerra ou cancela o comando em execução.", "MISSÃO 02": "Observe primeiro a forma final. Identifique linhas, círculos, arcos e demais geometrias antes de começar. Construa a peça e compare a sequência de comandos utilizada por sua equipe com outras soluções."}, "03": {"Modificação": "Os comandos Modify transformam geometrias existentes. MOVE reposiciona; COPY duplica; ROTATE gira; TRIM remove trechos excedentes; EXTEND prolonga objetos até um limite; OFFSET cria geometrias paralelas ou concêntricas; MIRROR cria uma cópia simétrica; FILLET cria concordâncias entre objetos.", "Estratégia": "Em CAD, editar uma geometria existente costuma ser mais eficiente do que reconstruí-la. Antes de apagar e redesenhar, identifique quais objetos podem ser movidos, copiados, aparados, estendidos, espelhados ou deslocados.", "MISSÃO 03": "Analise o arquivo antes de alterar qualquer objeto. Localize erros de posição, trechos excedentes, elementos ausentes e geometrias que podem ser reaproveitadas. A correção deve preservar tudo o que já estiver tecnicamente correto."}, "04": {"Precisão": "Um desenho pode parecer correto na tela e ainda possuir erros geométricos. A precisão depende de referências exatas, coordenadas e recursos de restrição de movimento — não apenas da posição visual do cursor.", "Object Snap": "OSNAP captura pontos geométricos específicos. Endpoint encontra extremidades; Midpoint, pontos médios; Center, centros de círculos e arcos; Quadrant, quadrantes; Intersection, interseções; Perpendicular, pontos que formam relação perpendicular. ORTHO restringe o cursor às direções ortogonais e Polar auxilia direções angulares.", "MISSÃO 04": "Evite selecionar pontos apenas pela aparência. Em cada conexão, determine qual referência geométrica deve ser capturada. Amplie o desenho e verifique se os elementos realmente coincidem."}, "05": {"Camadas": "Layers organizam o desenho por função e permitem controlar propriedades como cor, tipo de linha, espessura e visibilidade. Essa separação facilita leitura, edição, conferência e preparação da documentação.", "Estrutura": "Uma estrutura mecânica pode separar contornos visíveis, eixos, furos, cotas, hachuras e linhas auxiliares. O importante é que cada camada tenha função clara e seja usada de maneira consistente.", "MISSÃO 05": "Organize o arquivo de modo que sua estrutura possa ser compreendida sem explicação verbal. Nomes, propriedades e distribuição dos objetos devem tornar evidente a função de cada camada."}, "06": {"Integração": "Uma peça 2D combina criação, edição, precisão e organização. Draw constrói a base; Modify reduz retrabalho; OSNAP garante referências geométricas; Layers estruturam o arquivo.", "Processo": "Antes de executar comandos, interprete a peça. Identifique formas-base, simetrias, centros, paralelismos e repetições. Depois construa, modifique e confira. A escolha da sequência influencia a eficiência do desenho.", "MISSÃO 06": "Construa uma peça mecânica completa usando os recursos já estudados. Ao terminar, confira geometria, conexões, organização das camadas e coerência das dimensões fornecidas."}, "07": {"Três vistas": "Projeções ortogonais representam um objeto por vistas relacionadas. Vista frontal, superior e lateral revelam características diferentes da mesma peça e, em conjunto, permitem interpretar sua forma.", "Correspondência": "As vistas não são desenhos independentes. Larguras, alturas, profundidades, eixos e detalhes precisam manter correspondência e alinhamento entre as projeções.", "MISSÃO 07": "A partir da peça proposta, determine a vista principal e construa as demais projeções. Use linhas de referência para preservar alinhamentos e confira se cada detalhe aparece nas vistas correspondentes."}, "08": {"Cotagem": "Cotagem registra as dimensões necessárias para interpretar e produzir a peça. O material-base localiza as ferramentas em Home → Annotation e Annotate → Dimensions.", "Sistema métrico": "O material utiliza configuração Metric, padrão ISO-25 e medidas em milímetros. Além do valor numérico, a cotagem precisa permanecer legível e associada corretamente à geometria.", "MISSÃO 08": "Cote a peça evitando informação ambígua ou desnecessariamente repetida. Depois, outra equipe deve conseguir interpretar dimensões e características principais somente pela documentação apresentada."}, "09": {"Escala": "No fluxo de CAD, a geometria do modelo deve manter suas dimensões reais. A escala de apresentação determina como o desenho será enquadrado na folha sem alterar a dimensão real da peça.", "Folha técnica": "A preparação da folha exige equilíbrio entre escala, enquadramento e legibilidade. Textos, cotas e geometria precisam permanecer claros no formato final.", "MISSÃO 09": "Prepare a peça para uma folha A4. Escolha uma escala compatível com o espaço disponível e verifique se cotas e detalhes continuam legíveis."}, "10": {"Cortes": "Vistas em corte revelam detalhes internos da peça. O plano de corte define o que será seccionado; corte total, parcial e meio corte são formas diferentes de comunicar a geometria interna.", "Hachura": "HATCH preenche regiões fechadas com um padrão. O material-base apresenta o comando em Home → Draw. Em desenho mecânico, a hachura é utilizada para indicar superfícies atingidas pelo plano de corte.", "MISSÃO 10": "Interprete a geometria interna antes de aplicar a hachura. Represente o corte solicitado e hachure apenas as regiões efetivamente seccionadas."}, "11": {"Integração avançada": "Peças mais complexas exigem combinar comandos em vez de tratá-los isoladamente. Reconhecer simetria, repetição, tangência, centros e referências reduz etapas e melhora a consistência.", "Controle": "Antes da entrega, confira geometria, referências, layers e cotagem. Pequenos erros de conexão ou organização podem não ser percebidos em uma visualização distante.", "MISSÃO 11": "Resolva um dos exercícios mecânicos de maior complexidade do material. Compare estratégias de construção e verifique o desenho com zoom antes de considerá-lo concluído."}, "12": {"Padrões": "Geometrias repetitivas aparecem com frequência em elementos mecânicos. Identificar centros, ângulos e repetições permite construir padrões consistentes em vez de repetir operações manualmente.", "Engrenagem": "O material original propõe o desenho de uma engrenagem a partir de parâmetros fornecidos. O exercício integra círcculos de referência, repetição geométrica e controle da forma.", "MISSÃO 12": "Construa a engrenagem a partir dos parâmetros apresentados. Defina primeiro as referências geométricas e só depois replique os elementos repetitivos."}, "13": {"Conjunto": "Na representação de conjunto, cada componente deixa de ser analisado isoladamente. Sua posição e relação com os demais elementos precisam comunicar como o mecanismo é organizado.", "Montagem": "Alinhamentos, eixos comuns, posição relativa e distinção entre componentes são essenciais para uma leitura clara da montagem.", "MISSÃO 13": "Desenvolva o componente atribuído à equipe e prepare-o para integração. Na montagem final, verifique alinhamento e relação geométrica com os demais componentes."}, "14": {"Layout": "O material-base define Layout como o ambiente adequado para preparar a impressão do desenho. É nele que a apresentação em folha é organizada sem alterar a geometria construída no Model.", "Viewport": "Viewport é uma janela do Layout para o Model. Por ela é possível enquadrar o desenho e controlar sua visualização na folha.", "MISSÃO 14": "Configure a prancha, crie a Viewport, enquadre o desenho e ajuste a escala de apresentação. Confira o resultado antes da saída final."}, "15": {"Integração final": "O projeto final reúne construção 2D, precisão, organização, projeções, cotagem, cortes quando necessários e preparação da prancha. O objetivo é produzir documentação técnica coerente do início ao fim.", "Entrega": "O arquivo final deve reunir geometria consistente, layers organizadas, vistas compreensíveis, cotagem legível e apresentação final adequada.", "MISSÃO FINAL": "Desenvolva e revise o projeto completo. A documentação deve permitir que outra equipe compreenda a peça e as informações necessárias sem depender de explicação oral."}};

"Projeções Ortogonais", "Representar a forma por vistas", [["Três vistas", "Frontal • Superior • Lateral."], ["Correspondência", "As vistas compartilham dimensões, alinhamentos e detalhes."], ["MISSÃO 07", "Produza as três vistas mantendo correspondência geométrica."]]], ["08", "Cotagem", "Comunicar dimensões", [["Cotagem", "Home → Annotation ou Annotate → Dimensions."], ["Sistema métrico", "Formato Metric • estilo ISO-25 • valores em milímetros."], ["MISSÃO 08", "Cote uma peça para que outra equipe consiga interpretá-la sem explicação adicional."]]], ["09", "Escala e Impressão", "Do modelo para a folha", [["Escala", "A geometria mantém dimensão real no Model"], [" a apresentação controla sua exibição."], ["Folha técnica", "Formato A4 • enquadramento • legibilidade • escala."], ["MISSÃO 09", "Prepare uma peça para apresentação em A4 com escala adequada."]]], ["10", "Cortes e Hachuras", "Revelar o interior da peça", [["Cortes", "Corte total • corte parcial • meio corte."], ["Hachura", "HATCH representa as superfícies seccionadas."], ["MISSÃO 10", "Represente a peça no corte indicado e aplique a hachura corretamente."]]], ["11", "Desenho Mecânico II", "Geometrias de maior complexidade", [["Integração avançada", "Construção • modificação • precisão • organização • cotagem."], ["Controle", "Geometria correta • layers coerentes • referências precisas • cotagem legível."], ["MISSÃO 11", "Construa e cote uma peça mecânica de maior complexidade."]]], ["12", "Elementos Mecânicos", "Geometria repetitiva e engrenagem", [["Padrões", "Elementos mecânicos podem apresentar simetria e repetição geométrica."], ["Engrenagem", "Construção a partir de parâmetros definidos."], ["MISSÃO 12", "Construa a engrenagem e identifique recursos que reduzam repetição manual."]]], ["13", "Montagem", "Do componente ao conjunto", [["Conjunto", "Componentes individuais precisam ser compreendidos em relação ao mecanismo."], ["Montagem", "Posição • alinhamento • relação entre componentes • clareza."], ["MISSÃO 13", "Cada equipe desenvolve um componente"], [" ao final, componham o conjunto."]]], ["14", "Layout, Viewport e Plotagem", "Apresentação profissional", [["Layout", "Ambiente adequado para preparar a impressão do desenho."], ["Viewport", "Janela do Layout para o Model"], [" controla a visualização e a escala."], ["MISSÃO 14", "Configure Layout, Viewport e escala para produzir a prancha final."]]], ["15", "Projeto Integrador", "Do problema à documentação", [["Integração final", "Modelagem 2D • organização • vistas • cotas • cortes • layout."], ["Entrega", "DWG organizado • representação coerente • cotagem • prancha final."], ["MISSÃO FINAL", "Desenvolva, revise e apresente um projeto tecnicamente legível por outra equipe."]]]],D=document.getElementById('deck');let slides=[],i=0;

do", "Mini escritório de engenharia", "Projeto final"]];

function render(){slides.forEach((s,n)=>s.classList.toggle('on',n===i));count.textContent=(i+1)+' / '+slides.length;prog.style.width=((i+1)/slides.length*100)+'%'}function go(d){i=Math.max(0,Math.min(slides.length-1,i+d));render()}function showMenu(){i=1;render()}function jump(n){i=slides.findIndex(s=>s.dataset.lesson===n);render()}
function openExplain(lesson,title){

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desenho Mecânico Digital — 15 Aulas</title>
<style>
:root{--d:#184017;--m:#8ABF63;--l:#92BF30;--a:#97BF41;--b:#F2F2F2}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:var(--d);color:#173716}
.s{position:absolute;inset:0;padding:7vh 7vw 11vh;background:var(--b);opacity:0;transform:translateX(28px);pointer-events:none;transition:.4s;overflow:auto}.s.on{opacity:1;transform:none;pointer-events:auto}.s:before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:linear-gradient(90deg,var(--d) 25%,var(--m) 25% 50%,var(--l) 50% 75%,var(--a) 75%)}.dark{background:linear-gradient(135deg,#102e10,var(--d),#285d25);color:white}.dark:before{background:linear-gradient(90deg,var(--l),var(--m),var(--a))}
.k{font-size:.8rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--d)}.dark .k{color:var(--a)}h1{font-size:clamp(3rem,7vw,7rem);line-height:.92;letter-spacing:-.04em;margin:.18em 0}h2{font-size:clamp(2.5rem,5vw,5.2rem);line-height:.96;letter-spacing:-.035em;margin:.18em 0;color:var(--d)}.hero{font-size:clamp(1.3rem,2.3vw,2.1rem);max-width:900px;color:#e8f0e5}.line{height:8px;width:150px;background:var(--l);margin:28px 0}
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:25px}.card{background:white;border:1px solid #d5dfd1;border-top:5px solid var(--l);padding:16px;min-height:100px;cursor:pointer;text-align:left;transition:.25s}.card b{display:block;color:var(--l);font-size:1.5rem}.card span{font-weight:800;color:var(--d)}.menu:hover .card{opacity:.25;transform:scale(.97)}.menu .card:hover{opacity:1;transform:translateY(-5px) scale(1.025);box-shadow:0 15px 35px #18401728}
.panel{max-width:1050px;background:white;border-left:9px solid var(--l);padding:30px 34px;box-shadow:0 15px 40px #18401718;margin-top:28px;transition:.3s}.panel:hover{transform:translateX(10px)}.panel p{font-size:clamp(1.3rem,2.2vw,2rem);line-height:1.55;margin:0}.badge{display:inline-block;margin-top:24px;padding:9px 13px;background:var(--d);color:white;font-weight:900;letter-spacing:.12em}.mission .panel{border-left-color:var(--d)}.mission .badge{background:var(--l);color:var(--d)}
nav{position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--d);display:flex;align-items:center;gap:9px;padding:0 18px;color:white;z-index:9}nav button{border:0;background:#285d25;color:white;padding:9px 13px;cursor:pointer}nav button:hover{background:var(--l);color:var(--d)}#count{margin-left:auto;font-family:Consolas}#prog{position:absolute;top:0;left:0;height:4px;background:var(--l)}@media(max-width:850px){.menu{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){.menu{grid-template-columns:repeat(2,1fr)}}

/* Cards completos do plano de 15 aulas */
.menu{grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:30px}
.course-card{min-height:260px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.card-head{padding:15px 17px 13px;background:#184017;color:#fff;text-align:left}
.card-head b{display:inline-block;color:#92BF30;font-size:1.35rem;margin:0 10px 0 0;vertical-align:middle}
.card-head span{color:#fff;font-size:1rem;vertical-align:middle}
.card-info{padding:12px 17px 0;text-align:left}
.card-info small,.card-product small{display:block;font-size:.64rem;letter-spacing:.12em;font-weight:900;color:#64805f;margin-bottom:4px}
.card-info p{font-size:.83rem;line-height:1.32;margin:0;color:#2c452a}
.card-product{margin-top:auto;padding:12px 17px 14px;background:#edf4e9;border-top:1px solid #d9e5d4;text-align:left}
.card-product strong{font-size:.88rem;color:#184017}
.menu:hover .course-card{opacity:.34}
.menu .course-card:hover{opacity:1}
@media(max-width:1050px){.menu{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.menu{grid-template-columns:1fr}}

</style></head><body><div id="deck"></div><nav><div id="prog"></div><button onclick="go(-1)">←</button><button onclick="go(1)">→</button><button onclick="showMenu()">15 Aulas</button><button onclick="document.documentElement.requestFullscreen?.()">Tela cheia</button><span id="count"></span></nav>
<script>
const L=[["01", "Introdução ao CAD", "Da prancheta ao desenho digital", [["Prancheta → CAD", "Evolução do desenho técnico e do AutoCAD."], ["Interface", "Application Menu • Quick Access • Ribbon • Área de trabalho • ViewCube • Navigation Bar • Linha de comando • Barra de status."], ["MISSÃO 01", "Crie um novo arquivo, configure as unidades em milímetros e navegue pelo ambiente Drafting & Annotation."]]], ["02", "Comandos Draw", "Construindo a geometria", [["Criação", "LINE • PLINE • CIRCLE • ARC • RECTANGLE • ELLIPSE • HATCH."], ["Atalhos", "L ↵ • PL ↵ • C ↵ • ARC ↵ • REC ↵ • EL ↵ • ESC para cancelar."], ["MISSÃO 02", "Reproduza a geometria apresentada usando uma sequência eficiente de comandos."]]], ["03", "Comandos Modify", "Editar sem redesenhar", [["Modificação", "MOVE • COPY • ROTATE • TRIM • EXTEND • OFFSET • MIRROR • FILLET."], ["Estratégia", "Preserve o que está correto e transforme somente o necessário."], ["MISSÃO 03", "Corrija uma peça com elementos fora de posição, excessos e ausências."]]], ["04", "Precisão e Object Snap", "Desenhar no ponto exato", [["Precisão", "Em desenho mecânico, proximidade visual não substitui posição geométrica exata."], ["Object Snap", "Endpoint • Midpoint • Center • Quadrant • Intersection • Perpendicular • ORTHO • POLAR."], ["MISSÃO 04", "Complete a geometria usando referências existentes e justifique cada ponto."]]], ["05", "Layers", "Organização técnica do arquivo", [["Camadas", "Controle de cor • tipo de linha • espessura • visibilidade."], ["Estrutura", "CONTORNO • EIXOS • FUROS • COTAS • HACHURA • CONSTRUÇÃO."], ["MISSÃO 05", "Organize a peça para que outra equipe compreenda o arquivo sem explicação oral."]]], ["06", "Desenho Mecânico I", "Integração dos fundamentos", [["Integração", "Draw + Modify + OSNAP + Layers."], ["Processo", "Interpretar → identificar geometrias-base → referenciar → construir → modificar → conferir."], ["MISSÃO 06", "Construa uma peça 2D completa, organizada e geometricamente precisa."]]], ["07", "Projeções Ortogonais", "Representar a forma por vistas", [["Três vistas", "Frontal • Superior • Lateral."], ["Correspondência", "As vistas compartilham dimensões, alinhamentos e detalhes."], ["MISSÃO 07", "Produza as três vistas mantendo correspondência geométrica."]]], ["08", "Cotagem", "Comunicar dimensões", [["Cotagem", "Home → Annotation ou Annotate → Dimensions."], ["Sistema métrico", "Formato Metric • estilo ISO-25 • valores em milímetros."], ["MISSÃO 08", "Cote uma peça para que outra equipe consiga interpretá-la sem explicação adicional."]]], ["09", "Escala e Impressão", "Do modelo para a folha", [["Escala", "A geometria mantém dimensão real no Model"], [" a apresentação controla sua exibição."], ["Folha técnica", "Formato A4 • enquadramento • legibilidade • escala."], ["MISSÃO 09", "Prepare uma peça para apresentação em A4 com escala adequada."]]], ["10", "Cortes e Hachuras", "Revelar o interior da peça", [["Cortes", "Corte total • corte parcial • meio corte."], ["Hachura", "HATCH representa as superfícies seccionadas."], ["MISSÃO 10", "Represente a peça no corte indicado e aplique a hachura corretamente."]]], ["11", "Desenho Mecânico II", "Geometrias de maior complexidade", [["Integração avançada", "Construção • modificação • precisão • organização • cotagem."], ["Controle", "Geometria correta • layers coerentes • referências precisas • cotagem legível."], ["MISSÃO 11", "Construa e cote uma peça mecânica de maior complexidade."]]], ["12", "Elementos Mecânicos", "Geometria repetitiva e engrenagem", [["Padrões", "Elementos mecânicos podem apresentar simetria e repetição geométrica."], ["Engrenagem", "Construção a partir de parâmetros definidos."], ["MISSÃO 12", "Construa a engrenagem e identifique recursos que reduzam repetição manual."]]], ["13", "Montagem", "Do componente ao conjunto", [["Conjunto", "Componentes individuais precisam ser compreendidos em relação ao mecanismo."], ["Montagem", "Posição • alinhamento • relação entre componentes • clareza."], ["MISSÃO 13", "Cada equipe desenvolve um componente"], [" ao final, componham o conjunto."]]], ["14", "Layout, Viewport e Plotagem", "Apresentação profissional", [["Layout", "Ambiente adequado para preparar a impressão do desenho."], ["Viewport", "Janela do Layout para o Model"], [" controla a visualização e a escala."], ["MISSÃO 14", "Configure Layout, Viewport e escala para produzir a prancha final."]]], ["15", "Projeto Integrador", "Do problema à documentação", [["Integração final", "Modelagem 2D • organização • vistas • cotas • cortes • layout."], ["Entrega", "DWG organizado • representação coerente • cotagem • prancha final."], ["MISSÃO FINAL", "Desenvolva, revise e apresente um projeto tecnicamente legível por outra equipe."]]]],D=document.getElementById('deck');let slides=[],i=0;
function add(cls,body,lesson=''){let s=document.createElement('section');s.className='s '+cls;s.dataset.lesson=lesson;s.innerHTML=body;D.appendChild(s);slides.push(s)}
add('dark','<div class="k">GRAU TÉCNICO • TÉCNICO EM MECÂNICA</div><h1>Desenho<br>Mecânico Digital</h1><div class="line"></div><p class="hero">AutoCAD 2D • 15 aulas • 45 horas</p>');
const CARD_DATA=[["01", "Introdução ao CAD", "Prancheta × CAD, evolução do AutoCAD, interface, Ribbon, Workspace, navegação, unidades", "Caça ao tesouro na interface + primeiro desenho", "Primeiro .dwg"], ["02", "Draw", "LINE, PLINE, CIRCLE, ARC, RECTANGLE e comandos de criação", "Professor sem mouse + desenho em equipes", "Geometrias 2D"], ["03", "Modify", "MOVE, COPY, ROTATE, TRIM, EXTEND, OFFSET, MIRROR etc.", "Arquivo propositalmente errado para a equipe corrigir", "Peça corrigida"], ["04", "Precisão", "Object Snap, ORTHO, Polar, coordenadas e referências", "Desenhar uma peça sem “clicar no olho”", "Peça dimensionalmente precisa"], ["05", "Layers", "Layers, cores, tipos de linha, organização", "Equipe A inicia arquivo e Equipe B precisa continuar", "DWG organizado"], ["06", "Desenho mecânico I", "Construção de peças 2D combinando Draw + Modify + OSNAP", "Desafio por níveis", "Peça mecânica 1"], ["07", "Projeções ortogonais", "Vista frontal, superior e lateral", "Uma equipe interpreta a peça da outra", "Três vistas"], ["08", "Cotagem", "Dimension, ISO-25, mm, configuração e boas práticas", "Auditoria dimensional entre equipes", "Desenho cotado"], ["09", "Escala e impressão", "Escalas, unidades, folha e preparação", "Cliente pediu em A4", "Prancha pronta"], ["10", "Cortes e hachuras", "Corte total, parcial, meio corte + HATCH", "Descobrir internamente uma peça a partir do corte", "Vista em corte"], ["11", "Desenho mecânico II", "Exercícios mais complexos do PPT", "Estações de desafios", "Peça mecânica 2"], ["12", "Elementos mecânicos", "Engrenagem e geometrias repetitivas", "Construção colaborativa de engrenagem", "Engrenagem 2D"], ["13", "Montagem", "Organização de componentes e representação de conjunto", "Cada equipe recebe um componente", "Conjunto mecânico"], ["14", "Layout, Viewport e Plotagem", "Model × Layout, Viewport, escala e impressão", "Preparar desenho como entrega profissional", "PDF / prancha técnica"], ["15", "Projeto integrador", "Aplicação de tudo", "Mini escritório de engenharia", "Projeto final"]];
let mc=CARD_DATA.map(x=>`<button class="card course-card" onclick="jump('${x[0]}')">
<div class="card-head"><b>${x[0]}</b><span>${x[1]}</span></div>
<div class="card-info"><small>CONTEÚDO</small><p>${x[2]}</p></div>
<div class="card-info"><small>PRÁTICA / DINÂMICA</small><p>${x[3]}</p></div>
<div class="card-product"><small>PRODUTO DA AULA</small><strong>${x[4]}</strong></div>
</button>`).join('');
add('','<div class="k">DISCIPLINA</div><h2>Plano de aprendizagem</h2><p>15 encontros • 3 horas por aula</p><div class="menu">'+mc+'</div>');
L.forEach(x=>{add('dark',`<div class="k">AULA ${x[0]}</div><h1>${x[1]}</h1><div class="line"></div><p class="hero">${x[2]}</p>`,x[0]);x[3].forEach(y=>{let m=y[0].includes('MISSÃO');add(m?'mission':'',`<div class="k">${m?'DESAFIO PRÁTICO':'AUTOCAD 2D'}</div><h2>${y[0]}</h2><div class="panel"><p>${y[1]}</p></div><div class="badge">${m?'MÃOS NA MASSA':'DESENHO MECÂNICO DIGITAL'}</div>`)});});
function render(){slides.forEach((s,n)=>s.classList.toggle('on',n===i));count.textContent=(i+1)+' / '+slides.length;prog.style.width=((i+1)/slides.length*100)+'%'}function go(d){i=Math.max(0,Math.min(slides.length-1,i+d));render()}function showMenu(){i=1;render()}function jump(n){i=slides.findIndex(s=>s.dataset.lesson===n);render()}addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))go(1);if(['ArrowLeft','PageUp'].includes(e.key))go(-1)});render();
</script></body></html>
